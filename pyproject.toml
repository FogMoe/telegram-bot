[project]
name = "fogmoe-telegram-bot"
version = "0.1.0"
description = "雾萌 · 多功能 Telegram 机器人"
readme = "README.md"
requires-python = ">=3.13,<3.14"

# 运行时依赖：src/ 里直接 import 的第三方包都要在这里声明，不能只靠传递依赖。
# 锁定版本以 uv.lock 为准，用 uv add / uv remove 修改依赖。
dependencies = [
    "python-telegram-bot[job-queue]",
    "litellm>=1.80.5",
    "pydantic>=2",
    "pydantic-settings>=2",
    # asyncio extra 提供 greenlet；SQLAlchemy 的 async 引擎没有它无法导入。
    # 上界保持在已验证的 2.0 系列，升级 2.1 需要单独评估并跑 MySQL 集成测试。
    "SQLAlchemy[asyncio]>=2.0,<2.1",
    "alembic",
    "asyncmy",
    # asyncmy 通过 caching_sha2_password（MySQL 8 默认认证方式）登录时需要 cryptography，
    # 缺少时只会在首次连接时抛 RuntimeError，所以显式声明。
    "cryptography",
    "aiohttp",
    "requests",
    "urllib3",
    "binance-futures-connector",
    # AI 回复用 1.x 的 convert() 渲染成 MessageEntity；2.x 需要单独评估。
    "telegramify-markdown>=1.4,<2",
    "trafilatura>=2.2.0",
    "e2b",
    # 网页密码哈希（Argon2id）。
    "argon2-cffi",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
    "mypy>=1.13",
]

[project.scripts]
fogmoe-telegram-bot = "fogmoe_telegram_bot.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.5"

[tool.pytest.ini_options]
testpaths = ["tests"]

# 增量类型检查：只检查下面 files 列出的稳定边界模块，其余代码不在检查范围内。
# 新边界模块通过 files 加入，规则见 docs/testing-guidelines.md。
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
