target-version = "py313"
line-length = 100

exclude = [
    ".venv",
    ".venv-linux",
    "alembic/versions",
]

[lint]
# E4 import 相关 / E7 语句相关 / E9 语法与 IO 错误 / F pyflakes
# I import 排序 / W 空白 / UP 语法现代化（Optional[x] -> x | None 等）
select = ["E4", "E7", "E9", "F", "I", "W", "UP"]

# 后续可考虑逐步打开：
#   "BLE"  裸 except Exception
#   "LOG"  logging 用法（项目里大量直接调用 root logger）

[lint.isort]
known-first-party = ["fogmoe_telegram_bot"]

[lint.per-file-ignores]
# conftest 必须先设置 BOT_ENV_FILE 再 import 项目模块
"tests/conftest.py" = ["E402"]
